<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweets LocalStorage</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <div id="contenido">
        <div class="container">
            <h1 class="text-center mt-2 mb-4">Local Storage</h1>
            <div class="row">
                <div class="col-lg-6">
                    <form id="formulario">
                        <label for="tweet" class="form-label">Tweet:</label>
                        <textarea name="tweet" id="tweet" class="form-control"></textarea>
                        <input type="submit" class="btn btn-primary w-100 mt-2" value="Agregar">
                    </form>
                </div>
                <div class="col-lg-6">
                    <h2 class="text-center">Mis Tweets</h2>
                    <div id="lista-tweets"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
